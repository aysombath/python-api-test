[project]
name = "python-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aysombath", email = "aysombath@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.39",
]

[project.scripts]
python-api = "python_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
